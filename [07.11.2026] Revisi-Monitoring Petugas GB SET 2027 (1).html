<style id="gb-style">
/* Layout: lembar kerja lapangan — kepala surat ringkas, papan rekap, lalu dua kolom tim (UMB / UMK) berisi kartu petugas bernomor */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d9dee4;
  --accent:#1f4e79; --accent-ink:#ffffff;
  --umb:#0f766e; --umb-soft:#e3f3f1; --umk:#b45309; --umk-soft:#fbefe1;
  --ok:#15803d; --ok-soft:#e4f4e8; --warn:#9a6700; --warn-soft:#fbf2d9;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2a3642;
  --accent:#7fb2e5; --accent-ink:#0f151b;
  --umb:#5eead4; --umb-soft:#12302d; --umk:#fbbf6a; --umk-soft:#33260f;
  --ok:#6ee7a0; --ok-soft:#123222; --warn:#f2c94c; --warn-soft:#332a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --ink:#e6ebf0; --muted:#9aa6b2; --line:#2a3642;
  --accent:#7fb2e5; --accent-ink:#0f151b;
  --umb:#5eead4; --umb-soft:#12302d; --umk:#fbbf6a; --umk-soft:#33260f;
  --ok:#6ee7a0; --ok-soft:#123222; --warn:#f2c94c; --warn-soft:#332a10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.head-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.02;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 14px var(--f-body);display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:#b42318;border-color:transparent;background:transparent;padding:6px 8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tally div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tally b{font-family:var(--f-display);font-stretch:90%;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tally span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;white-space:pre-wrap}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:600 13px var(--f-body);padding:8px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 220px;max-width:320px;font:15px var(--f-body);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;align-items:start}
.team{display:flex;flex-direction:column;gap:10px;min-width:0}
.team-h{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.team-h .code{font-family:var(--f-mono);font-size:13px;padding:2px 8px;border-radius:4px}
.team-h h2{font-family:var(--f-display);font-stretch:90%;font-size:20px;margin:0;font-weight:700}
.team-h small{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.k-UMB{--k:var(--umb);--k-soft:var(--umb-soft)} .k-UMK{--k:var(--umk);--k-soft:var(--umk-soft)}
.team-h .code{background:var(--k-soft);color:var(--k)}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;min-width:0}
a.card:hover{border-color:var(--k);box-shadow:0 0 0 1px var(--k)}
.num{font-family:var(--f-mono);font-size:13px;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;background:var(--k-soft);color:var(--k)}
.who{min-width:0;display:flex;flex-direction:column}
.who strong{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.who span{font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);padding:12px 0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:center;gap:10px;margin-top:6px}
.grp-h .role{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--k);border:1px solid var(--k);border-radius:4px;padding:1px 6px}
.grp-h strong{font-weight:600;font-size:15px}
.grp-h small{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.grp .list{padding-left:14px;border-left:2px solid var(--k-soft)}
.sub-h{font-family:var(--f-display);font-stretch:90%;font-size:17px;margin:4px 0 0;font-weight:700}
td.pml{width:190px}
table.pml-t{min-width:480px}
/* panel kelola */
.manage{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px}
.manage h2{font-family:var(--f-display);font-stretch:90%;margin:0;font-size:22px}
.manage p{margin:0;color:var(--muted);font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:15px var(--f-body);text-transform:none;letter-spacing:0;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.rows{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px}
td{padding:4px 6px;vertical-align:middle}
td.n{font-family:var(--f-mono);color:var(--muted);width:40px}
td.kat{width:110px} td.act{width:60px}
input.bad{border-color:#b42318}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{font-size:14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px}
@media (max-width:560px){.tally{grid-template-columns:repeat(2,minmax(0,1fr))}.search{max-width:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* tab navigasi + rekap */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-top:-6px}
.tabs button{font:600 14px var(--f-body);padding:10px 14px;color:var(--muted);background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.rk-sec{display:flex;flex-direction:column;gap:10px}
.rk-sec h2{font-family:var(--f-display);font-stretch:90%;font-size:20px;margin:0;font-weight:700}
.rk-sec .hint{color:var(--muted);font-size:13px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.c1{background:var(--ok)} .c2{background:var(--umb)} .c3{background:var(--accent)} .cx{background:#c2410c} .cb{background:var(--line)}
table.rk{min-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:10px;border-collapse:separate;border-spacing:0;overflow:hidden}
table.rk th{background:var(--bg);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
table.rk td{padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.rk tr:last-child td{border-bottom:0}
table.rk td.r,table.rk th.r{text-align:right}
table.rk tr.tot td{font-weight:700;background:var(--bg)}
table.rk td.dim{color:var(--muted)}
.bar2{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);min-width:90px;flex:1}
.bar2 i{display:block;height:100%}
.progc{display:flex;align-items:center;gap:8px;min-width:150px}
.progc b{font-weight:600;min-width:42px;text-align:right}
.chip{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:4px;background:var(--k-soft);color:var(--k)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters select{width:auto;min-width:200px;background:var(--surface)}
.need{display:inline-block;min-width:24px;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700}
a.plink{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
a.plink:hover{color:var(--k);border-bottom-color:var(--k)}
table.tg-t{min-width:300px;max-width:420px}
table.tg-t input{text-align:right}
table.rk.rs{min-width:560px}
.up{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.up h3{margin:0;font-family:var(--f-display);font-stretch:90%;font-size:19px}
.up ol{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--bg)}
.drop input{width:auto;background:transparent;border:0}
.up table{min-width:620px}
.st-ok{color:var(--ok);font-weight:600} .st-no{color:#b42318;font-weight:600}

  /* ---------- agregasi rekap ---------- */
  function A(){return {n:0,'1':0,'2':0,'3':0,x:0,b:0};}

  var SRC = null;

  var DUMMY = null;
  function dummyData(){
    if(DUMMY) return DUMMY;
    var seed=20271106; function rnd(){seed=(seed*1103515245+12345)%2147483648; return seed/2147483648;}
    function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
    var KAT={UMB:['C','C','C','D','E','F','G','G','H','I','J','K','L','M','N','P','Q','S'], UMK:['C','C','G','G','G','G','I','I','I','S','S','H','N']};
    var LAIN=['4','5','6','7','8'];
    var out={};
    STATE.petugas.forEach(function(p,ix){
      var n=p.kat==='UMB'?10+Math.floor(rnd()*9):18+Math.floor(rnd()*15);
      var prog=0.35+rnd()*0.6, rows=[];
      for(var i=0;i<n;i++){
        var k=pick(KAT[p.kat]||KAT.UMB), v='', w='';
        if(rnd()<prog){ var r=rnd();
          if(r<0.64){v='1';w=k;} else if(r<0.75){v='2';do{w=pick(KAT[p.kat]||KAT.UMB);}while(w===k);} else if(r<0.84){v='3';w=k;} else {v=pick(LAIN);}
        }
        rows.push(['D'+pad(ix+1)+pad(i+1),k,v,w]);
      }
      out[p.id]={tgl:today(), src:'dummy', rows:rows};
    });
    return (DUMMY=out);
  }
  var DUMMY2 = null;
  function dummyData2(){
    if(DUMMY2) return DUMMY2;
    var seed=4242; function rnd(){seed=(seed*1103515245+12345)%2147483648; return seed/2147483648;}
    var out={}, LAIN=['4','5','6','7','8'];
    STATE.kategori.forEach(function(k){
      var ps=STATE.petugas.filter(function(p){return p.kat===k.kode;}); if(!ps.length) return;
      var prog={}; ps.forEach(function(p){ prog[p.id]=0.35+rnd()*0.6; out[p.id]={tgl:today(), src:'dummy', rows:[]}; });
      var tg=(STATE.target||{})[k.kode]||{}, ix=0, keys=Object.keys(tg).sort();
      keys.forEach(function(L){ var t=tg[L]; if(!t) return; var n=t+Math.max(1,Math.ceil(t*0.3));
        for(var i=0;i<n;i++){ var p=ps[ix++%ps.length], v='', w='';
          if(rnd()<prog[p.id]){ var r=rnd(); if(r<0.66){v='1';w=L;} else if(r<0.74){v='2';w=pick(keys,L);} else if(r<0.84){v='3';w=L;} else v=LAIN[Math.floor(rnd()*LAIN.length)]; }
          out[p.id].rows.push(['D'+L+pad(i+1),L,v,w]); } });
      function pick(arr,not){var c=arr.filter(function(x){return x!==not && tg[x];}); return c.length?c[Math.floor(rnd()*c.length)]:not;}
    });
    return (DUMMY2=out);
  }
  var LETTERS='ABCDEFGHIJKLMNOPQRSTU'.split('');
  function aggPetugas(p){var a=A(), d=dataOf(p); if(d) d.rows.forEach(function(r){addTo(a,r[2]);}); return a;}

  var NUMH = '<th class="r">Sampel</th><th class="r">Kode 1</th><th class="r">Kode 2</th><th class="r">Kode 3</th><th class="r">Eligible</th><th class="r">Tidak eligible</th><th class="r">Belum didata</th>';

  /* ---------- tampilan utama ---------- */
  function headHTML(){
    return '<header class="head"><div class="head-text"><span class="eyebrow">'+esc(STATE.satker)+' · Dashboard Petugas</span>'+
         '<h1>Monitoring Petugas GB SET 2027</h1><p class="sub">'+esc(STATE.kegiatan)+'.'+(ui.tab==='daftar'?' Klik nama petugas untuk membuka spreadsheet masing-masing.':'')+'</p></div>'+

         '</div></header>'+

           return '<button type="button" data-tab="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>'; }).join('')+'</nav>';
  }

  function viewHTML(){
    var h = '<div class="wrap">'+headHTML();
    if(ui.editing) h += manageHTML();
    if(ui.tab==='simpel'){
      var hasReal = STATE.petugas.some(function(p){return STATE.rekap[p.id];});

  function listHTML(){
    var P = STATE.petugas, linked = P.filter(function(p){return okUrl(p.url);}).length, h='';
    var counts = STATE.kategori.map(function(k){return {k:k, n:P.filter(function(p){return p.kat===k.kode;}).length};});
    h += '<section class="tally" aria-label="Rekap petugas"><div><b>'+P.length+'</b><span>Total petugas</span></div><div><b>'+PML().length+'</b><span>PML</span></div>';
    counts.forEach(function(c){h+='<div><b>'+c.n+'</b><span>Petugas '+esc(c.k.kode)+'</span></div>';});
    h += '<div><b>'+linked+'/'+P.length+'</b><span>Spreadsheet tertaut</span></div></section>';

    h += '<div class="tools"><div class="seg" role="group" aria-label="Filter kategori">';
    [{v:'ALL',t:'Semua'}].concat(STATE.kategori.map(function(k){return {v:k.kode,t:k.kode};})).forEach(function(o){
      h+='<button type="button" data-f="'+esc(o.v)+'" aria-pressed="'+(ui.filter===o.v)+'">'+esc(o.t)+'</button>';});
    h += '</div><input class="search" id="q" type="search" placeholder="Cari nama petugas atau PML" value="'+esc(ui.q)+'" aria-label="Cari nama petugas atau PML"></div>';
    h += '<div class="teams">';
    var q = ui.q.trim().toLowerCase();
    function card(x){
      var p=x.p, ok=okUrl(p.url), a=aggPetugas(p), d=dataOf(p);

                  '<span class="pill '+(ok?'ok':'no')+'">'+(ok?'Tertaut':'Belum')+'</span>';
      return '<li>'+(ok?'<a class="card k-'+esc(p.kat)+'" href="'+esc(p.url.trim())+'" target="_blank" rel="noopener">'+inner+'</a>':'<div class="card k-'+esc(p.kat)+'">'+inner+'</div>')+'</li>';
    }
    STATE.kategori.forEach(function(k){
      if(ui.filter!=='ALL' && ui.filter!==k.kode) return;
      var inKat = P.map(function(p,i){return {p:p,i:i};}).filter(function(x){return x.p.kat===k.kode;});
      var pmls = PML().filter(function(m){return m.kat===k.kode;});
      h += '<section class="team k-'+esc(k.kode)+'"><div class="team-h"><span class="code">'+esc(k.kode)+'</span><h2>'+esc(k.nama)+'</h2><small>'+pmls.length+' PML · '+inKat.length+' petugas</small></div>';
      var shown = 0;
      var groups = pmls.map(function(m){return {m:m, xs:inKat.filter(function(x){return x.p.pml===m.id;})};});
      var loose = inKat.filter(function(x){return !pmls.some(function(m){return m.id===x.p.pml;});});
      if(loose.length) groups.push({m:null, xs:loose});
      groups.forEach(function(g){
        var pmlHit = g.m && q && g.m.nama.toLowerCase().indexOf(q)>-1;
        var xs = g.xs.filter(function(x){return !q || pmlHit || x.p.nama.toLowerCase().indexOf(q)>-1;});
        if(q && !xs.length && !pmlHit) return;

        xs.forEach(function(x){h+=card(x);});
        h += '</ul></div>';
      });

      h += '</section>';

  function cells(ps){
    var m={};
    ps.forEach(function(p){ var d=dataOf(p); if(!d) return; var tm=(m[p.kat]=m[p.kat]||{});

  /* ---------- pembacaan spreadsheet ---------- */
  function norm(s){return String(s==null?'':s).replace(/\s+/g,' ').trim();}
  var NUMCELL=/^\(?-?\d{1,2}\)?$/;
  function findCol(grid, from, upto, re){ for(var r=from;r<upto;r++){var row=grid[r]||[]; for(var c=0;c<row.length;c++){ if(re.test(norm(row[c]).toUpperCase())) return c;}} return -1;}
  function letter(s){var t=norm(s).toUpperCase(), m=t.match(/^\[?([A-Z])\]?(?=$|[\s.\-:)])/); return m?m[1]:t.slice(0,14);}
  function parseGrid(grid){
    var h=-1;
    for(var r=0;r<Math.min(20,grid.length);r++){ if((grid[r]||[]).some(function(c){return /IDENTIFIKASI\s+KEBERADAAN/i.test(norm(c));})){h=r;break;} }
    if(h<0) return null;
    var from=Math.max(0,h-2), lim=Math.min(grid.length,h+3);
    var cV=findCol(grid,from,lim,/IDENTIFIKASI\s+KEBERADAAN/);
    var cW=findCol(grid,from,lim,/KATEGORI\s+USAHA\s*\(?\s*HASIL/);
    var cK=findCol(grid,from,lim,/^KATEGORI\s+USAHA$/);
    var cK2=findCol(grid,from,lim,/^KATEGORI\s+(DI\s+LAPANGAN|HASIL\s+IDENTIFIKASI\s+AWAL)$/);
    var cId=findCol(grid,from,lim,/IDSBR/);
    var cNm=findCol(grid,from,lim,/NAMA\s+LENGKAP/);
    if(cW<0) cW=cV+1;
    var rows=[];
    for(var r2=h+1;r2<grid.length;r2++){
      var row=grid[r2]||[];
      var id=cId>-1?norm(row[cId]):'', nm=cNm>-1?norm(row[cNm]):'';
      if(!id && !nm) continue;
      if((id && NUMCELL.test(id)) || (!id && NUMCELL.test(nm))) continue;

  function parseDelim(text, d){
    var out=[],row=[],cell='',q=false,ch;

      else if(ch==='"' && cell===''){ q=true; }
      else if(ch===d){ row.push(cell); cell=''; }
      else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); out.push(row); row=[]; cell=''; }

  function loadScript(src,glob){return new Promise(function(res,rej){ if(window[glob]) return res(window[glob]); var s=document.createElement('script'); s.src=src; s.onload=function(){window[glob]?res(window[glob]):rej(new Error('pustaka gagal dimuat'));}; s.onerror=function(){rej(new Error('pustaka gagal dimuat, periksa koneksi'));}; document.head.appendChild(s);});}
  function readOne(f){
    if(/\.zip$/i.test(f.name)) return f.arrayBuffer().then(function(b){return JSZip.loadAsync(b);}).then(function(z){
      var ents=[]; z.forEach(function(path,e){ if(!e.dir && /\.(xlsx|xls|csv)$/i.test(path) && !/(^|\/)(__MACOSX|\._)/.test(path)) ents.push(e); });
      if(!ents.length) return [{name:f.name, err:'Tidak ada file .xlsx/.csv di dalam zip'}];
      return Promise.all(ents.map(function(e){ var nm=e.name.split('/').pop();
        return /\.csv$/i.test(nm) ? e.async('string').then(function(t){return csvItem(nm,t);}) : e.async('arraybuffer').then(function(b){return xlsxItem(nm,b);}); }));
    });
    if(/\.csv$/i.test(f.name)) return f.text().then(function(t){return [csvItem(f.name,t)];});

  function driveErr(e){
    var c=e&&e.code;
    if(c==='needs_reauth') return 'Koneksi Google Drive kedaluwarsa. Sambungkan ulang di claude.ai → Settings → Connectors.';
    if(c==='server_not_connected'||c==='selection_required') return 'Google Drive belum tersambung di akun yang membuka dashboard ini. Tambahkan di claude.ai → Settings → Connectors.';
    if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required') return 'Izin Google Drive untuk dashboard ini belum diberikan. Tekan tombol lagi lalu pilih Izinkan.';
    if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed') return 'Penarikan data tidak tersedia di tampilan ini. Buka dashboard di claude.ai.';
    if(c==='blocked_by_policy') return 'Akses Google Drive diblokir oleh kebijakan organisasi.';
    if(c==='server_unavailable'||c==='rate_limited') return 'Google Drive sedang tidak merespons. Coba lagi sebentar lagi.';

  var FATAL={needs_reauth:1,server_not_connected:1,selection_required:1,not_in_manifest:1,approval_required:1,consent_required:1,not_granted:1,capability_disabled:1,capability_removed:1,blocked_by_policy:1};
  function syncDrive(){
    if(!ui.mcp || ui.sync.busy) return;
    var list=STATE.petugas.filter(function(p){return fileIdOf(p.url);});
    ui.sync={busy:true, done:0, total:list.length, ok:{}, fail:[], msg:''}; render();
    var i=0;
    function next(){
      if(i>=list.length) return finish();
      var p=list[i++];
      ui.mcp.callTool(DRIVE,'download_file_content',{fileId:fileIdOf(p.url), exportMimeType:'text/csv'},{cache:false})
      .then(function(res){
        var pl=res&&res.payload, b=pl&&(pl.content||pl.data);
        if(!b) throw {code:'tool_error', message:'isi file kosong'};
        var g=parseGrid(parseDelim(b64text(b),','));
        if(!g) ui.sync.fail.push(p.nama+': kolom IDENTIFIKASI KEBERADAAN tidak ditemukan');
        else ui.sync.ok[p.id]=g.rows;
      })
      .catch(function(e){
        if(e && FATAL[e.code]){ ui.sync.fatal=driveErr(e); i=list.length; return; }
        ui.sync.fail.push(p.nama+': '+driveErr(e));
      })
      .then(function(){ ui.sync.done++; render(); next(); });
    }
    function finish(){
      var ids=Object.keys(ui.sync.ok);

      var st=clone(STATE), t=today(); st.rekap=st.rekap||{};
      ids.forEach(function(id){ st.rekap[id]={tgl:t, src:'Google Drive', rows:ui.sync.ok[id]}; });
      st.diperbarui=t;
      var note=ids.length+' spreadsheet terbaca'+(ui.sync.fail.length?'; gagal: '+ui.sync.fail.join('; '):'')+'. ';
      publish(st, function(m){ ui.sync.msg=note+m; ui.sync.busy=false; }, 'b-sync');
    }
    next();
  }

    if(t.id==='b-up'){ ui.upOpen=!ui.upOpen; render(); return; }
    if(t.id==='b-paste'){ readPaste(); return; }
    if(t.dataset.updel!=null){ ui.up.items.splice(+t.dataset.updel,1); render(); return; }
    if(t.id==='b-saverk'){ saveRekap(); return; }
    if(t.id==='b-sync'){ syncDrive(); return; }
    if(t.id==='b-add'){ ui.draft.petugas.push({id:nextId(ui.draft.petugas),nama:'',kat:ui.draft.kategori[0].kode,pml:'',target:'',url:''}); render(); return; }
    if(t.dataset.del!=null){ ui.draft.petugas.splice(+t.dataset.del,1); render(); return; }
    if(t.id==='b-add-pml'){ var mx=0; ui.draft.pml.forEach(function(x){var n=parseInt(String(x.id).replace(/\D/g,''),10); if(n>mx)mx=n;}); ui.draft.pml.push({id:'m'+pad(mx+1),nama:'',kat:ui.draft.kategori[0].kode}); render(); return; }
    if(t.dataset.delpml!=null){ var gone=ui.draft.pml.splice(+t.dataset.delpml,1)[0]; ui.draft.petugas.forEach(function(p){ if(p.pml===gone.id) p.pml=''; }); render(); return; }
    if(t.id==='b-bulk'){ bulk(); return; }
    if(t.id==='b-cancel'){ ui.editing=false; ui.draft=null; ui.msg=''; render(); return; }
    if(t.id==='b-save'){ save(); }
  });
  root.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='q'){ ui.q=t.value; render(); return; }
    if(t.id==='paste-t'){ ui.up.paste=t.value; return; }
    if(!ui.draft) return;
    if(t.dataset.k){ ui.draft[t.dataset.k]=t.value; return; }
    if(t.dataset.tk){ var pr=t.dataset.tk.split('|'); ui.draft.target=ui.draft.target||{}; (ui.draft.target[pr[0]]=ui.draft.target[pr[0]]||{})[pr[1]]=t.value; return; }
    if(t.tagName==='SELECT') return;
    if(t.dataset.mi!=null){ ui.draft.pml[+t.dataset.mi][t.dataset.f]=t.value; return; }
    if(t.dataset.i!=null && t.dataset.f){ ui.draft.petugas[+t.dataset.i][t.dataset.f]=t.value; if(t.dataset.f==='url') t.classList.toggle('bad', !!t.value && !okUrl(t.value)); }
  });
  root.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='f-up'){ handleFiles(t.files); return; }
    if(t.id==='rp'){ ui.rp=t.value; render(); return; }
    if(t.id==='sp'){ ui.sp=t.value; render(); return; }
    if(t.id==='paste-pid'){ ui.up.pastePid=t.value; return; }
    if(t.dataset.upi!=null){ ui.up.items[+t.dataset.upi].pid=t.value; render(); return; }
    if(!ui.draft || t.tagName!=='SELECT') return;
    if(t.dataset.mi!=null){ var m=ui.draft.pml[+t.dataset.mi]; m.kat=t.value; ui.draft.petugas.forEach(function(p){ if(p.pml===m.id && p.kat!==m.kat) p.pml=''; }); render(); return; }
    if(t.dataset.i!=null){ var p=ui.draft.petugas[+t.dataset.i]; p[t.dataset.f]=t.value; if(t.dataset.f==='kat') p.pml=''; render(); }
  });
  root.addEventListener('dragover',function(e){ var d=e.target.closest&&e.target.closest('#drop'); if(!d) return; e.preventDefault(); d.classList.add('over'); });
  root.addEventListener('dragleave',function(e){ var d=e.target.closest&&e.target.closest('#drop'); if(d) d.classList.remove('over'); });
  root.addEventListener('drop',function(e){ var d=e.target.closest&&e.target.closest('#drop'); if(!d) return; e.preventDefault(); handleFiles(e.dataTransfer&&e.dataTransfer.files); });

  window.__gbTest = {parseGrid:parseGrid, parseDelim:parseDelim, matchPetugas:matchPetugas, b64text:b64text, fileIdOf:fileIdOf};
  render();

  try{
    if(window.claude && typeof window.claude.use==='function'){
      window.claude.use('artifact').then(function(a){
        if(!a) return;
        ui.artifact = a; ui.canEdit = true; render();
        window.claude.use('mcp').then(function(m){ if(m){ ui.mcp=m; render(); } }).catch(function(){});
      }).catch(function(){});
    }
  }catch(e){}

})();
</script></body></html>
